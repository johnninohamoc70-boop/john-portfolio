<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Registration</h1>
        <p class="subtitle">Please fill out the form below</p>

        <form>

            <div class="form-group">
                <label>Student ID</label>
                <input type="text" placeholder="Enter Student ID" required>
            </div>

            <div class="form-group">
                <label>First Name</label>
                <input type="text" placeholder="Enter First Name" required>
            </div>

            <div class="form-group">
                <label>Middle Name</label>
                <input type="text" placeholder="Enter Middle Name">
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" placeholder="Enter Last Name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter Email Address" required>
            </div>

            <div class="form-group">
                <label>Contact Number</label>
                <input type="tel" placeholder="Enter Contact Number" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" required>
            </div>

            <div class="form-group">
                <label>Gender</label>

                <select required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Course</label>

                <select required>
                    <option value="">Select Course</option>
                    <option value="BSCS">BS Computer Science</option>
                    <option value="BSIT">BS Information Technology</option>
                    <option value="BSIS">BS Information Systems</option>
                </select>
            </div>

            <div class="form-group">
                <label>Year Level</label>

                <select required>
                    <option value="">Select Year Level</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                </select>
            </div>

            <div class="form-group">
                <label>Section</label>
                <input type="text" placeholder="Example: BSCS-1A" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea placeholder="Enter Complete Address" required></textarea>
            </div>

            <button type="submit">Register Student</button>

        </form>

    </div>

</body>
</html>
